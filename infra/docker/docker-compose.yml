version: '3.8'

services:
  backend:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - BACKEND_PORT=3001
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=erp_dev
      - DATABASE_SYNCHRONIZE=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=erp-saas-construcao-super-secret-jwt-key-min-32-chars
      - JWT_REFRESH_SECRET=erp-saas-construcao-refresh-secret-key-min-32-chars
      - CORS_ORIGIN=http://localhost:5175
    volumes:
      - ../../apps/backend:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
    command: npm run start:dev

  frontend:
    build:
      context: ../../apps/frontend
      dockerfile: Dockerfile
    ports:
      - "5175:5175"
    environment:
      - VITE_API_URL=http://localhost:3001
      - VITE_API_PREFIX=/api/v1
    volumes:
      - ../../apps/frontend:/app
      - /app/node_modules
    command: npm run dev

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=erp_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
