name: CD - Staging

on:
  push:
    branches: [develop]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        working-directory: apps/backend
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/erp-backend:staging .
          docker push ${{ steps.login-ecr.outputs.registry }}/erp-backend:staging

      - name: Build and push frontend
        working-directory: apps/frontend
        run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/erp-frontend:staging .
          docker push ${{ steps.login-ecr.outputs.registry }}/erp-frontend:staging

      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --region us-east-1 --name erp-staging
          kubectl apply -k infra/k8s/overlays/staging/
          kubectl rollout status deployment/backend -n staging
          kubectl rollout status deployment/frontend -n staging
