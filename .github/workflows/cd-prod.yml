name: CD - Production

on:
  push:
    branches: [main]

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend
        working-directory: apps/backend
        run: |
          VERSION=$(cat package.json | jq -r '.version')
          docker build -t ${{ steps.login-ecr.outputs.registry }}/erp-backend:$VERSION .
          docker build -t ${{ steps.login-ecr.outputs.registry }}/erp-backend:latest .
          docker push ${{ steps.login-ecr.outputs.registry }}/erp-backend:$VERSION
          docker push ${{ steps.login-ecr.outputs.registry }}/erp-backend:latest

      - name: Build and push frontend
        working-directory: apps/frontend
        run: |
          VERSION=$(cat package.json | jq -r '.version')
          docker build -t ${{ steps.login-ecr.outputs.registry }}/erp-frontend:$VERSION .
          docker build -t ${{ steps.login-ecr.outputs.registry }}/erp-frontend:latest .
          docker push ${{ steps.login-ecr.outputs.registry }}/erp-frontend:$VERSION
          docker push ${{ steps.login-ecr.outputs.registry }}/erp-frontend:latest

      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --region us-east-1 --name erp-prod
          kubectl apply -k infra/k8s/overlays/prod/
          kubectl rollout status deployment/backend -n production
          kubectl rollout status deployment/frontend -n production
